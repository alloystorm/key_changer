name: Deploy to GitHub Pages

on:
  push:
    branches: [web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache soundfonts
        id: soundfont-cache
        uses: actions/cache@v4
        with:
          path: public/soundfonts
          key: soundfonts-v1

      - name: Download soundfonts
        if: steps.soundfont-cache.outputs.cache-hit != 'true'
        run: node scripts/download-soundfonts.mjs

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "dist/index.html missing!" && exit 1)
          grep -q 'assets/' dist/index.html || (echo "dist/index.html looks unbuilt!" && exit 1)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
